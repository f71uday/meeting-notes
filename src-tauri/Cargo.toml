[package]
name = "ai-meeting-assistant"
version = "0.1.0"
description = "Local-first AI meeting assistant for macOS"
authors = ["You"]
edition = "2021"

[lib]
name = "ai_meeting_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
keyring = "4.2"
url = "2"
reqwest = { version = "0.13.5", features = ["json", "multipart", "rustls"] }
uuid = { version = "1.29.3", features = ["v4"] }
hound = "3.5.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
screen-capture-kit = "0.7.1"
core-media = { version = "=0.8.1", features = ["objc"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSString"] }
core-foundation = "0.10.0"
dispatch2 = "0.3.1"
